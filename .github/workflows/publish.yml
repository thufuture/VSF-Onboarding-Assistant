name: publish

# Build và đẩy image amd64 (backend, frontend) lên GHCR, xuất digest.
# Được release.yml gọi khi merge vào main; chạy tay được để thử build (không deploy).
on:
  workflow_call:
    outputs:
      backend_image:
        description: "ghcr.io/<owner>/<repo>-backend@sha256:..."
        value: ${{ jobs.publish.outputs.backend_image }}
      frontend_image:
        description: "ghcr.io/<owner>/<repo>-frontend@sha256:..."
        value: ${{ jobs.publish.outputs.frontend_image }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # chỉ job này được ghi GHCR
    outputs:
      backend_image: ${{ steps.summary.outputs.backend }}
      frontend_image: ${{ steps.summary.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tên image (GHCR yêu cầu chữ thường)
        id: img
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "backend=${base}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${base}-frontend" >> "$GITHUB_OUTPUT"

      # Hiện chỉ amd64 (Hetzner là x86). Dùng Oracle A1 (ARM) thì thêm setup-qemu-action và linux/arm64.
      - name: Build và đẩy backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.backend }}:sha-${{ github.sha }}
            ${{ steps.img.outputs.backend }}:main
          provenance: true
          sbom: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build và đẩy frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.frontend }}:sha-${{ github.sha }}
            ${{ steps.img.outputs.frontend }}:main
          provenance: true
          sbom: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Digest để deploy
        id: summary
        run: |
          backend="${{ steps.img.outputs.backend }}@${{ steps.backend.outputs.digest }}"
          frontend="${{ steps.img.outputs.frontend }}@${{ steps.frontend.outputs.digest }}"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          {
            echo "### Image đã đẩy"
            echo '```'
            echo "$backend"
            echo "$frontend"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
