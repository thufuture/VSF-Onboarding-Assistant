name: verify

# Cổng chất lượng dùng chung cho PR (ci.yml) và, sau này, release.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      db:
        # Cùng image với docker-compose.yml; KHÔNG ghi đè command (mặc định đã nạp pg_search và pg_cron).
        image: paradedb/paradedb:v0.25.4-pg16
        env:
          POSTGRES_USER: vsf
          POSTGRES_PASSWORD: vsf
          POSTGRES_DB: vsf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vsf -d vsf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://vsf:vsf@localhost:5432/vsf
      VSF_TEST_DATABASE_URL: postgresql+asyncpg://vsf:vsf@localhost:5432/vsf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Migration trên Postgres thật
        run: |
          alembic upgrade head
          alembic check
      - run: pytest

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
