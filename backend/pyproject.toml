[project]
name = "vsf-onboarding-assistant-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test import fixture từ `portal_docs_fixtures` (pytest tìm theo tên): ruff coi là import thừa/ghi đè.
"tests/integration/test_portal_*.py" = ["F401", "F811"]
"tests/integration/test_viga_*.py" = ["F401", "F811"]
"tests/integration/test_ticket_*.py" = ["F401", "F811"]
"tests/integration/test_admin_metrics_api.py" = ["F401", "F811"]
"tests/integration/test_analytics_api.py" = ["F401", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dùng Depends(...) làm giá trị mặc định của tham số; đó là cách dùng đúng.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

# Thư viện ngoài không có type stub (2-B: nạp tài liệu).
[[tool.mypy.overrides]]
module = ["underthesea", "cloudinary", "cloudinary.uploader", "markitdown", "langfuse"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: cần PostgreSQL thật (đặt VSF_TEST_DATABASE_URL); tự bỏ qua nếu thiếu",
]
