name: vsf

# Chạy: docker compose --env-file /opt/vsf-aws/env/compose.env -f compose.aws.yml up -d
# Bản AWS của compose.vps.yml: BỎ service frontend (frontend chạy trên Vercel, không phải máy này).
# Chỉ Caddy publish cổng. Image backend đến từ BACKEND_IMAGE (ghim theo digest).
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?đặt PUBLIC_HOST trong compose.env}
      ACME_EMAIL: ${ACME_EMAIL:?đặt ACME_EMAIL trong compose.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [private]
    depends_on: [backend]
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "5"}

  backend:
    image: ${BACKEND_IMAGE:?đặt BACKEND_IMAGE}
    restart: unless-stopped
    init: true
    expose: ["8000"]
    env_file: ${ENV_DIR:-/opt/vsf-aws/env}/backend.env
    # Cấu hình tối ưu Viga (benchmark 10-12/10/2026, xem docs/value/optimize-chatviga/BAO-CAO-TONG-HOP-BENCHMARK-VIGA.md).
    # Đặt ở đây (không phải backend.env) để đi qua PR và deploy; `environment` thắng `env_file`. Muốn đổi riêng máy này thì đặt
    # biến cùng tên trong compose.env (mặc định bên dưới chỉ dùng khi compose.env không đặt). Hoàn tác nhanh: đặt
    # RETRIEVAL_PROFILE=legacy, VIGA_ROUTER_V2=false, ANSWER_THINKING_MODE=always trong compose.env rồi deploy lại.
    # Đo trên production 12/10/2026 với cấu hình cũ: bước trả lời mất ~40 s (đưa ~60 mục, suy luận ~3.000 token).
    environment:
      RETRIEVAL_PROFILE: ${RETRIEVAL_PROFILE:-optimized}
      VIGA_ROUTER_V2: ${VIGA_ROUTER_V2:-true}
      ANSWER_THINKING_MODE: ${ANSWER_THINKING_MODE:-adaptive}
    networks: [private]
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  embedder:
    # Embedding BGE-M3 tự host, chạy cùng máy này (thay máy EC2 riêng). Backend gọi http://embedder:8080 qua mạng riêng,
    # KHÔNG publish cổng nào ra ngoài. Ảnh được build NGAY TRÊN MÁY này từ ./embedder (scripts/aws/deploy.sh tự build khi
    # thiếu hoặc khi mã nguồn đổi) nên không có bước pull. Khóa API và cấu hình nằm ở env/embedder.env (ngoài repo, quyền 600).
    image: vsf-embedder:bge-m3
    pull_policy: never
    restart: unless-stopped
    init: true
    expose: ["8080"]
    env_file:
      - path: ${ENV_DIR:-/opt/vsf-aws/env}/embedder.env
        required: false # máy chưa có file thì deploy.sh bỏ qua embedder, các service khác vẫn chạy
    networks: [private]
    # Giới hạn để một lô nạp tài liệu lớn không bóp nghẹt Postgres và backend trên cùng máy 2 vCPU/8 GiB. Đo thật 08/10/2026:
    # lô 32 đoạn dài ~30 giây, đỉnh RAM mô hình ~1,7 GB, /api/v1/ready của backend vẫn p95 26 ms khi embedder chạy hết công suất.
    cpus: 1.5
    mem_limit: 3500m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8080/health', timeout=4)).get('status') == 'ok' else 1)"
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 120s
    logging: *logging

  db:
    # KHÔNG ghi đè `command`: lệnh mặc định của image đã nạp pg_search,pg_cron,pg_stat_statements.
    image: paradedb/paradedb:${PARADEDB_TAG:-v0.25.4-pg16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?đặt POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?đặt POSTGRES_DB}
    expose: ["5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      # postmaster.pid = 1 xác nhận máy chủ thật, không phải máy chủ tạm lúc khởi tạo.
      test:
        - CMD-SHELL
        - >-
          test "$$(head -n 1 /var/lib/postgresql/data/postmaster.pid)" = "1" &&
          pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  migrate:
    image: ${BACKEND_IMAGE:?đặt BACKEND_IMAGE}
    profiles: [tools]
    command: ["alembic", "upgrade", "head"]
    env_file: ${ENV_DIR:-/opt/vsf-aws/env}/backend.env
    networks: [private]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

networks:
  private:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
