<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSF Onboarding Portal - Prototype v15 (Roadmap dùng chung HR/AI)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Hệ thiết kế: phẳng, viền mảnh, bo 5px cho mọi thẻ/nút/ô nhập, màu dịu.
   Màu biểu đồ đã chạy validate_palette (ordinal xanh 3 bậc sáng/tối, categorical 3 slot). */
:root{--font:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;--mono:ui-monospace,"JetBrains Mono",Consolas,monospace;--r:5px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;background:#f4f6f9}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
.shell,.login,.lp{
  --bg:#f4f6f9;--surface:#fff;--surface-2:#f0f3f7;--line:#e3e7ee;--line-2:#d0d7e2;
  --ink:#111a2b;--ink-2:#4a5568;--ink-3:#8590a2;
  --accent:#1090cb;--accent-strong:#0877ac;--accent-soft:#e8f3fa;--on-accent:#fff;--navy:#0c2d5b;
  --ok:#2b7a58;--ok-soft:#e6f2ec;--warn:#946512;--warn-soft:#f7efdc;--crit:#b23a3a;--crit-soft:#f8e9e9;
  --c-done:#104281;--c-doing:#2a78d6;--c-wait:#86b6ef;--c-lock:#cfd5de;--c-block:#d03b3b;
  --c-k1:#2a78d6;--c-k2:#eb6834;--c-k3:#1baf7a;
  --tn-blue:#0e7fb3;--tn-teal:#1f7f7a;--tn-indigo:#4f5bbf;--tn-amber:#a8681a;--tn-rose:#b0476a;--tn-slate:#5b6b82;
  background:var(--bg);color:var(--ink);color-scheme:light;
}
.dark{
  --bg:#0c1524;--surface:#111d30;--surface-2:#182740;--line:#213350;--line-2:#2f4667;
  --ink:#e9eef7;--ink-2:#a9b6ca;--ink-3:#7a8aa3;
  --accent:#35b0e6;--accent-strong:#6cc6ef;--accent-soft:#12324d;--on-accent:#04182d;--navy:#1a4f8c;
  --ok:#4cc38a;--ok-soft:#10352a;--warn:#e0a44a;--warn-soft:#3a2c12;--crit:#ef7b7b;--crit-soft:#3a1a1a;
  --c-done:#9ec5f4;--c-doing:#3987e5;--c-wait:#1c5cab;--c-lock:#334158;--c-block:#ef7b7b;
  --c-k1:#3987e5;--c-k2:#d95926;--c-k3:#199e70;
  --tn-blue:#5fc0ee;--tn-teal:#56c2bb;--tn-indigo:#9aa4ee;--tn-amber:#e0a44a;--tn-rose:#ec8fae;--tn-slate:#9aa8bd;color-scheme:dark;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.proto{background:#0c2d5b;color:#cfe6f5;font-size:11.5px;padding:5px 12px;text-align:center}
.proto b{color:#fff}
.tip{position:fixed;z-index:400;background:#111a2b;color:#fff;font-size:12px;padding:5px 8px;border-radius:var(--r);pointer-events:none;display:none;max-width:260px}

/* ---------- Khung ---------- */
.shell{display:flex;min-height:calc(100dvh - 26px)}
.sidebar{position:sticky;top:0;height:calc(100dvh - 26px);width:248px;flex:none;display:flex;flex-direction:column;gap:4px;padding:14px 12px;background:var(--surface);border-right:1px solid var(--line);z-index:30;overflow:hidden}
.brand{flex:none;display:flex;align-items:center;gap:10px;padding:2px 6px 12px}
.mark{width:30px;height:30px;border-radius:var(--r);background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.brand b{display:block;font-size:14px;line-height:1.2;font-weight:600}
.brand small{color:var(--ink-3);font-size:11px}
.rolebadge{flex:none;margin:0 6px 8px;font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border:0;border-radius:var(--r);background:transparent;color:var(--ink-2);font-size:13px;font-weight:500;text-align:left}
.nav button span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.nav small{padding:0 6px;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:var(--r);background:var(--crit);color:#fff;font-size:11px;font-weight:600}
.account{flex:none;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.user{display:flex;align-items:center;gap:10px;padding:2px 4px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.user b{display:block;font-size:13px;line-height:1.3;font-weight:600}
.user small{color:var(--ink-3);font-size:11.5px}
.content{flex:1;min-width:0;display:flex;flex-direction:column;height:calc(100dvh - 26px)}
.topbar{flex:none;display:flex;align-items:center;gap:10px;height:52px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .ttl{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.topbar .ttl small{color:var(--ink-3);font-weight:400}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.workspace{flex:1;min-height:0;display:flex}
.page{flex:1;min-width:0;overflow-y:auto;padding:22px 24px 48px}
.inner{max-width:1180px;margin:0 auto}

/* ---------- Thành phần ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:var(--r);border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.sec:hover{border-color:var(--accent);color:var(--accent-strong)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.navy:hover{filter:brightness(1.15)}
.btn.danger{background:var(--surface);color:var(--crit);border-color:var(--crit)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ibtn{position:relative;display:inline-grid;place-items:center;width:32px;height:32px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface)}
.ibtn:hover{border-color:var(--accent);color:var(--accent-strong)}
.badge{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;padding:0 4px;border-radius:var(--r);background:var(--crit);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;height:30px;padding:0 11px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--navy);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px 10px}
.card-h h2{font-size:14px;font-weight:600}
.card-h small{display:block;color:var(--ink-3);font-size:12px;margin-top:1px}
.card-b{padding:4px 16px 16px}
.card-b.flush{padding:0}
.link{border:0;background:transparent;color:var(--accent-strong);font-size:12.5px;font-weight:600;padding:0}
.link:hover{text-decoration:underline}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.grid>*{min-width:0}
.mt{margin-top:14px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.pagehead h1{font-size:20px;font-weight:600;letter-spacing:-.005em}
.pagehead p{color:var(--ink-2);margin-top:2px}
.kpi{padding:14px 16px}
.kpi small{display:block;color:var(--ink-3);font-size:12px;font-weight:500}
.kpi b{display:block;font-size:26px;font-weight:600;line-height:1.2;margin:2px 0}
.kpi b.hero{font-size:44px;letter-spacing:-.02em}
.kpi span.s{color:var(--ink-2);font-size:12px}
.meter{height:6px;border-radius:3px;background:color-mix(in srgb,var(--c-doing) 18%,var(--surface));margin:8px 0 6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c-doing);border-radius:3px}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:4px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.s-DONE{background:var(--ok-soft);color:var(--ok)}
.s-READY,.s-IN_PROGRESS{background:var(--accent-soft);color:var(--accent-strong)}
.s-WAITING_EXTERNAL,.s-WAITING_APPROVAL{background:var(--warn-soft);color:var(--warn)}
.s-BLOCKED{background:var(--crit-soft);color:var(--crit)}
.s-LOCKED,.s-NOT_APPLICABLE,.s-SKIPPED{background:var(--surface-2);color:var(--ink-3)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);font-size:11px;font-weight:500}
.tag.mono{font-family:var(--mono)}
.tag.sample{background:var(--warn-soft);color:var(--warn)}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3);font-size:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.note{display:flex;gap:10px;padding:10px 12px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-strong);font-size:12.5px;border-left:3px solid var(--accent)}
.note.warn{background:var(--warn-soft);color:var(--warn);border-left-color:var(--warn)}
.note.crit{background:var(--crit-soft);color:var(--crit);border-left-color:var(--crit)}
.note.ok{background:var(--ok-soft);color:var(--ok);border-left-color:var(--ok)}
.note svg{flex:none;margin-top:2px}
.callout{display:flex;gap:8px;padding:8px 10px;border-radius:var(--r);font-size:12.5px;background:var(--accent-soft);color:var(--accent-strong);border-left:3px solid var(--accent)}
.callout.k-warn{background:var(--warn-soft);color:var(--warn);border-left-color:var(--warn)}
.callout.k-tip{background:var(--ok-soft);color:var(--ok);border-left-color:var(--ok)}
.callout svg{flex:none;margin-top:2px}
label{display:block;font-weight:500;font-size:12.5px;margin-bottom:5px}
textarea,input[type=text],input[type=email],input[type=password],select{width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);min-height:34px}
textarea{min-height:76px;resize:vertical}
ul.clean,ol.clean{margin:0;padding-left:18px;color:var(--ink-2)}ul.clean li,ol.clean li{margin:3px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--ink-3);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);height:28px;padding:0 10px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.crumb{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12.5px;margin-bottom:8px}
.crumb button{border:0;background:transparent;color:var(--accent-strong);font-weight:500;padding:0}
.overlay{position:fixed;inset:0;background:rgb(10 20 36 / 50%);display:grid;place-items:center;z-index:120;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:var(--r);width:min(460px,100%);padding:20px;border:1px solid var(--line)}
.modal h2{font-size:16px;font-weight:600;margin-bottom:10px}
.modal.wide{width:min(760px,100%);max-height:88vh;overflow-y:auto}
.modal.vwide{width:min(980px,100%)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111a2b;color:#fff;padding:9px 14px;border-radius:var(--r);font-size:13px;z-index:200;max-width:90vw}
.backdrop{display:none}

/* ---------- Biểu đồ ---------- */
.chart{width:100%;height:auto;display:block}
.chart .ax{font-size:12px;fill:var(--ink-3)}
.chart .ax2{font-size:12.5px;fill:var(--ink-2)}
.chart .lab{font-size:12.5px;fill:var(--ink-2);font-weight:500}
.chart .grid line{stroke:var(--line)}
.chart .axl{stroke:var(--line-2);stroke-width:1}
.chart rect[data-tip]:hover{filter:brightness(1.12)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 8px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.note-mock{color:var(--ink-3);font-size:11.5px;margin-top:4px}

/* ---------- Cây theo ngày (thanh bên) ---------- */
.tree-back{flex:none;display:flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--ink-2);font-size:12.5px;font-weight:500;padding:2px 6px}
.tree-back:hover{color:var(--accent-strong)}
.jhead{flex:none;padding:8px 6px 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.jhead b{display:block;font-size:14px;font-weight:600}
.jhead .meter{margin:6px 0 4px}
.jhead small{color:var(--ink-3);font-size:12px}
.vbtn{flex:none;display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 10px;border:1px solid var(--navy);border-radius:var(--r);background:var(--navy);color:#fff;font-weight:600;font-size:13px;margin-bottom:8px}
.vbtn:hover{filter:brightness(1.15)}
.jscroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding-right:2px}
.jscroll>*{flex:none}
.tg-h{display:flex;align-items:center;gap:2px}
.tg-name{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;height:32px;padding:0 8px;border:0;border-radius:var(--r);background:transparent;text-align:left;font-weight:600;font-size:12.5px;color:var(--ink)}
.tg-name:hover{background:var(--surface-2)}
.tg-name.on{background:var(--accent-soft);color:var(--accent-strong)}
.tg-name small{color:var(--ink-3);font-weight:500;font-size:11.5px}
.tg-chev{width:24px;height:32px;border:0;background:transparent;color:var(--ink-3);display:grid;place-items:center;border-radius:var(--r)}
.tg-chev:hover{background:var(--surface-2)}
.tg-chev svg{transition:transform .12s}
.tg.open .tg-chev svg{transform:rotate(90deg)}
.tg-list{display:none;flex-direction:column;gap:1px;margin:0 0 6px 10px;padding-left:8px;border-left:1px solid var(--line)}
.tg.open .tg-list{display:flex}
.jtask{display:flex;align-items:center;gap:8px;width:100%;min-height:30px;padding:4px 8px;border:0;border-radius:var(--r);background:transparent;text-align:left}
.jtask:hover{background:var(--surface-2)}
.jtask.on{background:var(--accent-soft)}
.jtask .g{width:16px;height:16px;flex:none;display:grid;place-items:center;color:var(--ink-3)}
.jtask.DONE .g{color:var(--ok)}.jtask.READY .g,.jtask.IN_PROGRESS .g{color:var(--accent-strong)}
.jtask.WAITING_EXTERNAL .g,.jtask.WAITING_APPROVAL .g{color:var(--warn)}.jtask.BLOCKED .g{color:var(--crit)}
.jtask .tx{min-width:0;flex:1;font-size:12.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.jtask.on .tx{color:var(--accent-strong);font-weight:600}
.jtask.DONE .tx{color:var(--ink-3)}

/* ---------- Danh sách việc ---------- */
.daytabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.daytab{border:0;background:transparent;padding:10px 14px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;text-align:left}
.daytab small{display:block;color:var(--ink-3);font-size:11.5px;font-weight:400}
.daytab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.dgroup{margin-top:16px}
.dgroup h3{font-size:12px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px;padding:0 2px}
.dgroup h3 small{color:var(--ink-3);font-weight:500;margin-left:4px}
.lrow{display:flex;align-items:flex-start;gap:12px;width:100%;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--surface-2)}
.lrow .g{width:20px;height:20px;flex:none;display:grid;place-items:center;margin-top:1px;color:var(--ink-3)}
.lrow.DONE .g{color:var(--ok)}.lrow.READY .g,.lrow.IN_PROGRESS .g{color:var(--accent-strong)}
.lrow.WAITING_EXTERNAL .g,.lrow.WAITING_APPROVAL .g{color:var(--warn)}.lrow.BLOCKED .g{color:var(--crit)}
.lrow .num{width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;margin-top:1px}
.lrow .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lrow .bd b{font-weight:600;font-size:13.5px}
.lrow .mt2{color:var(--ink-3);font-size:12px}
.lrow .hint{font-size:12px;display:inline-flex;gap:6px;align-items:flex-start}
.hint.ok{color:var(--ok)}.hint.warn{color:var(--warn)}.hint.crit{color:var(--crit)}.hint.lock{color:var(--ink-3)}
.sim{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--ink-2);font-size:12.5px;margin-bottom:12px}
.how-ol{padding-left:18px;margin:0}.how-ol li{margin:8px 0;color:var(--ink-2)}.how-ol b{color:var(--ink)}

/* ---------- Trang chi tiết task ---------- */
.thead h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
.tmeta{color:var(--ink-2);margin-top:4px;font-size:13px}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-top:14px}
.strip>div{padding:10px 14px;border-right:1px solid var(--line);min-width:0}
.strip>div:last-child{border-right:0}
.strip small{display:block;color:var(--ink-3);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.strip b{font-weight:500;font-size:13px;line-height:1.4;display:block}
.tcols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start;margin-top:18px}
.tcols>*{min-width:0}
.doc>section{padding:18px 0;border-top:1px solid var(--line)}
.doc>section:first-child{border-top:0;padding-top:4px}
.doc h2{font-size:14px;font-weight:600;margin-bottom:10px}
.doc p{color:var(--ink-2)}
.rail{position:sticky;top:0;display:flex;flex-direction:column;gap:14px}
.panel-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.panel-h h2{font-size:13px;font-weight:600}
.panel-b{padding:14px}
.vsteps{list-style:none;margin:0 0 14px;padding:0}
.vsteps li{position:relative;display:flex;align-items:center;gap:10px;padding:0 0 12px 0;color:var(--ink-3);font-size:12.5px}
.vsteps li::before{content:"";position:absolute;left:5px;top:14px;bottom:-2px;width:1px;background:var(--line-2)}
.vsteps li:last-child{padding-bottom:0}.vsteps li:last-child::before{display:none}
.vsteps i{width:11px;height:11px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);flex:none;position:relative;z-index:1}
.vsteps li.past{color:var(--ink-2)}.vsteps li.past i{background:var(--ok);border-color:var(--ok)}
.vsteps li.cur{color:var(--ink);font-weight:600}.vsteps li.cur i{border-color:var(--accent);background:var(--accent)}
.vsteps li.bad{color:var(--crit);font-weight:600}.vsteps li.bad i{border-color:var(--crit);background:var(--crit)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:12.5px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0}
ol.steps3{list-style:none;margin:0;padding:0}
.step3{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;position:relative;padding-bottom:18px}
.step3:last-child{padding-bottom:0}
.step3::before{content:"";position:absolute;left:11.5px;top:26px;bottom:-2px;width:1px;background:var(--line-2)}
.step3:last-child::before{display:none}
.step3 .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink-2);position:relative;z-index:1}
.step3 .sb{display:flex;flex-direction:column;gap:6px;min-width:0}
.step3 .sb b{font-size:13.5px;font-weight:600;line-height:24px}
.step3 .sb p{margin:0}
.step3 .sb ul{margin:0;padding-left:18px;color:var(--ink-2)}
.shot{display:flex;align-items:center;justify-content:center;gap:8px;min-height:84px;padding:12px;border:1px dashed var(--line-2);border-radius:var(--r);background:var(--surface-2);color:var(--ink-3);font-size:12px;text-align:center}
.subitem{display:flex;gap:10px;align-items:flex-start;padding:5px 0;color:var(--ink-2);cursor:pointer}
.subitem input{width:16px;height:16px;margin-top:2px;accent-color:var(--accent)}
.subitem.done span{text-decoration:line-through;color:var(--ink-3)}
.faqi{border-bottom:1px solid var(--line)}.faqi:last-child{border-bottom:0}
.faqq{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 0;border:0;background:transparent;text-align:left;font-weight:500}
.faqq svg{transition:transform .12s;color:var(--ink-3);flex:none}
.faqi.open .faqq svg{transform:rotate(90deg)}
.faqa{padding:0 0 10px;color:var(--ink-2)}
.docrow{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left}
.docrow:hover{border-color:var(--accent)}
.dico{width:32px;height:32px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;flex:none}
.dtx{flex:1;min-width:0}.dtx b{display:block;font-size:13px;font-weight:600}.dtx small{color:var(--ink-3);font-size:12px}
.contact{display:flex;gap:12px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.contact .avatar{width:30px;height:30px}
.linkcard{display:flex;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.linkcard .ico{width:30px;height:30px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;flex:none}
.tpl{white-space:pre-wrap;font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;line-height:1.6}
.timeline{display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--ink-2)}
.timeline div{display:flex;gap:8px}.timeline i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);margin-top:7px;flex:none}
.trow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);width:100%;text-align:left}
.trow:hover{border-color:var(--accent)}
.trow .txt{flex:1;min-width:0}.trow .txt b{display:block;font-size:13px;font-weight:500}.trow .txt span{color:var(--ink-3);font-size:12px}
.st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none}

/* ---------- Viga ---------- */
.chat{width:380px;flex:none;display:none;flex-direction:column;border-left:1px solid var(--line);background:var(--surface)}
.chat.open{display:flex}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chat-head .mark{width:28px;height:28px}
.chat-head b{display:block;font-size:13.5px;font-weight:600}.chat-head small{color:var(--ink-3);font-size:11.5px}
.chat-head .ibtn{margin-left:auto}
.chat-head .ibtn+.ibtn{margin-left:0}
.chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.msg{max-width:92%;padding:9px 11px;border-radius:var(--r);font-size:13px}
.msg.user{align-self:flex-end;background:var(--navy);color:#fff}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.rtype{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:600;padding:0 5px;border-radius:3px;margin-bottom:5px;background:var(--surface-2);color:var(--ink-2)}
.rtype.PREREQUISITE_REQUIRED{color:var(--warn);background:var(--warn-soft)}
.rtype.NEXT_STEP,.rtype.DAY_PLAN{color:var(--accent-strong);background:var(--accent-soft)}
.rtype.NOT_IN_JOURNEY{color:var(--crit);background:var(--crit-soft)}
.blocks{margin:8px 0;display:flex;flex-direction:column;gap:4px}
.blocks div{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:var(--r);padding:5px 8px;font-size:12px}
.blocks div span{flex:1;min-width:0}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
details.json summary{font-size:11.5px;color:var(--ink-3);cursor:pointer;margin-top:8px}
details.json pre{margin:6px 0 0;font-size:11px;background:var(--surface-2);border-radius:var(--r);padding:8px;overflow:auto;max-height:180px}
.chat-foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.quick{display:flex;flex-wrap:wrap;gap:5px}
.quick button{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);height:26px;padding:0 8px;font-size:12px;color:var(--ink-2)}
.quick button:hover{border-color:var(--accent);color:var(--accent-strong)}
.chat-form{display:flex;gap:6px}.chat-form input{flex:1}
.topics{display:flex;flex-direction:column;gap:8px}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px}
.topic .th{display:flex;gap:10px;align-items:flex-start}
.topic .ti{width:26px;height:26px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;flex:none}
.topic b{display:block;font-size:13px;font-weight:600}.topic small{color:var(--ink-3);font-size:12px}
.tq{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tq button{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);height:26px;padding:0 8px;font-size:12px;color:var(--ink-2);text-align:left}
.tq button:hover{border-color:var(--accent);color:var(--accent-strong)}
.vlink{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--accent-strong);font-weight:600;font-size:12.5px;padding:2px 0;text-align:left}
.vsec{margin-top:16px}.vsec h3{font-size:14px;font-weight:600;margin:0 0 8px}
.vflow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:stretch}
.vbox{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface-2);font-size:12.5px}
.vbox>b{display:block;margin-bottom:6px;font-weight:600}
.varrow{align-self:center;color:var(--ink-3)}
.vjson{margin:0;font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;overflow:auto;max-height:260px}

/* ---------- Thông báo ---------- */
.ncard{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:var(--surface)}
.ncard:last-child{border-bottom:0}

.nico{width:30px;height:30px;border-radius:var(--r);display:grid;place-items:center;flex:none}
.nbody{display:flex;flex-direction:column;gap:1px;min-width:0}
.nmeta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3)}.nmeta b{color:var(--ink-2);font-weight:600}
.ndot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.ntitle{font-size:13.5px;font-weight:600}.nsub{color:var(--ink-2);font-size:12.5px}
.nlink{display:inline-flex;align-items:center;gap:4px;margin-top:3px;color:var(--accent-strong);font-size:12px;font-weight:600}

/* ---------- Đăng nhập ---------- */
.login{display:grid;grid-template-columns:1.1fr 1fr;min-height:calc(100dvh - 26px)}
.story{background:var(--navy);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center;gap:20px}

.pgn{min-width:28px;height:28px;padding:0 6px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink-2);display:inline-grid;place-items:center}

.thread{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}

.cbox{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;gap:8px;align-items:flex-end}
.mrow .msg{flex:1;min-width:0;max-width:none}
.acts .btn{white-space:normal;height:auto;min-height:28px;padding:4px 10px;text-align:left}

th{background:color-mix(in srgb,var(--navy) 8%,var(--surface));color:var(--ink-2);border-bottom:1px solid var(--line-2)}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 4%,var(--surface))}

.hcard em{margin-top:auto;font-style:normal;font-size:11.5px;font-weight:600;color:var(--c)}
.hcard:hover{background:var(--surface-2)}
.rflag{position:absolute;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line-2);color:var(--ink-2);z-index:2}
.rflag.e{color:#d9962b;border-color:#d9962b}
/* v11 */
.tkthread{display:flex;flex-direction:column;gap:12px;margin:8px 0 14px}
.tkmsg{display:flex;gap:10px;align-items:flex-start}
.tkmsg .cb{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.tkmsg.hr .cb{background:var(--accent-soft);border-color:transparent}
.tkmsg .ch{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}.tkmsg .ch span{color:var(--ink-3);font-size:12px}
.tkmsg p{margin:0;white-space:pre-wrap}
.atts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.att{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface-2);color:var(--ink-2);font-size:12px}
.att img,.att video{display:block;max-width:180px;max-height:120px}
.att.ph{padding:10px 12px}
.tkreply{border-top:1px solid var(--line);padding-top:12px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px;text-align:center;color:var(--ink-2)}
.empty svg{color:var(--ok)}
</style>

/* Renderer Markdown giới hạn cho nội dung do HR/AI tạo. Luôn escape HTML trước khi định dạng. */
function guideMarkdown(source){
  const inline=value=>esc(value)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>');
  const lines=String(source||'').replace(/\r/g,'').split('\n'),out=[];
  let list=null,quote=[];
  const closeList=()=>{if(list){out.push('</'+list+'>');list=null}};
  const closeQuote=()=>{if(quote.length){out.push('<blockquote>'+quote.map(inline).join('<br>')+'</blockquote>');quote=[]}};
  for(const raw of lines){
    const line=raw.trim();
    const bullet=/^[-*]\s+(.+)$/.exec(line),number=/^\d+[.)]\s+(.+)$/.exec(line),heading=/^(#{1,3})\s+(.+)$/.exec(line);
    if(line.startsWith('> ')){closeList();quote.push(line.slice(2));continue}
    closeQuote();
    if(bullet||number){const kind=bullet?'ul':'ol';if(list!==kind){closeList();list=kind;out.push('<'+kind+'>')}out.push('<li>'+inline((bullet||number)[1])+'</li>');continue}
    closeList();
    if(!line)continue;
    if(heading){const level=Math.min(5,heading[1].length+2);out.push('<h'+level+'>'+inline(heading[2])+'</h'+level+'>')}
    else out.push('<p>'+inline(line)+'</p>');
  }
  closeList();closeQuote();return out.join('');
}

/* Mô phỏng backend: mọi thay đổi trạng thái đều đi qua hàm này và bị kiểm tra. */
function transition(id,to,opt){
  opt=opt||{};const t=TMAP[id],cur=st(id);
  const fail=m=>{toast('Backend từ chối: '+m);return false};
  if(!ALLOWED[cur].includes(to))return fail('không thể chuyển '+STATUS[cur]+' → '+STATUS[to]+'.');
  if(cur==='READY'&&missing(id).length)return fail('chưa xong tiên quyết.');
  if(to==='DONE'){
    if(t.completion==='OWNER_APPROVAL'&&opt.actor!=='owner')return fail('task này cần owner/mentor duyệt, AI và người dùng không được tự chốt.');
    if(t.completion==='EVIDENCE_REQUIRED'&&!(opt.evidence||S.tasks[id].evidence).trim())return fail('cần nhập minh chứng.');
  }
  if(to==='WAITING_APPROVAL'&&!(opt.evidence||'').trim())return fail('cần nhập ghi chú/minh chứng để gửi duyệt.');
  if(to==='WAITING_EXTERNAL'&&!(opt.evidence||'').trim())return fail('cần ghi ngày gửi/nộp.');
  if(to==='BLOCKED'&&!(opt.reason||'').trim())return fail('cần nhập lý do kẹt.');
  const T=S.tasks[id];T.status=to;
  if(opt.evidence)T.evidence=opt.evidence;
  if(opt.reason)T.reason=opt.reason;
  T.log.unshift({t:now(),text:STATUS[cur]+' → '+STATUS[to]+(opt.actor==='owner'?' (do owner duyệt)':'')});
  const before=Object.fromEntries(TASKS.map(x=>[x.id,st(x.id)]));
  refreshLocks();
  TASKS.forEach(x=>{if(before[x.id]==='LOCKED'&&st(x.id)==='READY')pushNotif('system','Đã mở khóa: '+x.title,'Bạn có thể bắt đầu task này vì đã xong các bước tiên quyết.',x.id)});
  return true;
}

function dayPlan(n){
  const D=DAYS.find(x=>x.n===n);
  const own=TASKS.filter(t=>t.day===n&&t.required&&st(t.id)!=='NOT_APPLICABLE');
  const carry=n===S.today?TASKS.filter(t=>t.day>0&&t.day<n&&t.required&&!['DONE','NOT_APPLICABLE'].includes(st(t.id))):[];
  const all=carry.concat(own);
  const open=all.filter(t=>['READY','IN_PROGRESS','BLOCKED'].includes(st(t.id))).sort((a,b)=>blocksCount(b.id)-blocksCount(a.id));
  const mins=open.reduce((a,t)=>a+t.minutes,0);
  let msg=(n===S.today?'Hôm nay là '+D.name+' ('+dayLabel(n)+').':D.name+' bắt đầu vào '+dayLabel(n)+'.')+' Mục tiêu: '+D.goal;
  msg+=open.length?' Bạn làm được ngay '+open.length+' việc (khoảng '+fmtMin(mins)+'), nên bắt đầu với "'+open[0].title+'".':' Hiện chưa có việc nào làm được ngay; các việc còn lại đang chờ hoặc bị khóa.';
  if(carry.length)msg+=' Có '+carry.length+' việc tồn từ ngày trước.';
  if(D.n>1)msg+=' (Nội dung Ngày 2 trở đi là bản mẫu, mentor/HR sẽ xác nhận.)';
  const acts=[{type:'OPEN_DAY',day:n,label:'Xem checklist '+D.name}];
  if(open[0])acts.push({type:'OPEN_TASK',task_id:open[0].id,label:'Mở: '+open[0].title});
  return {response_type:'DAY_PLAN',message:msg,current_task_id:open[0]?open[0].id:null,blocking_tasks:all.slice(0,6).map(t=>({task_id:t.id,title:t.title,status:st(t.id)})),suggested_actions:acts,sources:[{type:'DAY',id:n}]};
}

function ask(q){

  if(/hôm nay|nên làm|làm gì tiếp|việc nào|bắt đầu từ đâu/i.test(q))return dayPlan(S.today);
  const flow=taskIntent(q);

    if(flow)return contactResp(flow.find(id=>st(id)!=='DONE')||flow[0]);

function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1))),m=v/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p}
function legend(series){return '<div class="legend">'+series.map(s=>'<span><i style="background:var(--'+s.c+')"></i>'+esc(s.label)+'</span>').join('')+'</div>'}
function barsH(rows,series,o){
  o=o||{};const W=o.W||480,padL=o.padL||92,padR=44,rowH=30,barH=16,top=2;
  const totals=rows.map(r=>series.reduce((a,s)=>a+(r.v[s.k]||0),0));
  const max=o.max||Math.max(1,...totals),sc=(W-padL-padR)/max,H=top+rows.length*rowH+2,f=o.fmt||(x=>String(x));
  let g='<line x1="'+padL+'" y1="0" x2="'+padL+'" y2="'+H+'" class="axl"/>';
  rows.forEach((r,i)=>{
    const y=top+i*rowH+(rowH-barH)/2;let x=padL;
    g+='<text x="'+(padL-10)+'" y="'+(y+barH/2+4)+'" text-anchor="end" class="ax2">'+esc(cut(r.label,o.cutN||16))+'</text>';
    series.forEach(s=>{const n=r.v[s.k]||0;if(!n)return;const w=n*sc;
      g+='<rect x="'+x.toFixed(1)+'" y="'+y+'" width="'+Math.max(w-2,2).toFixed(1)+'" height="'+barH+'" rx="3" style="fill:var(--'+s.c+')" data-tip="'+esc(r.label+' · '+s.label+': '+f(n))+'"/>';x+=w});
    g+='<text x="'+(x+6).toFixed(1)+'" y="'+(y+barH/2+4)+'" class="lab">'+f(totals[i])+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="'+esc(o.aria||'Biểu đồ cột ngang')+'">'+g+'</svg>';
}
function barsV(cols,series,o){
  o=o||{};const W=o.W||480,H=210,padL=30,padB=28,top=20,padR=8,f=o.fmt||(x=>String(x)),tk=o.tick||(x=>String(Math.round(x*10)/10));
  const totals=cols.map(c=>series.reduce((a,s)=>a+(c.v[s.k]||0),0));
  const max=niceMax(Math.max(1,...totals)),steps=max<=4?max:4,ph=H-top-padB,pw=W-padL-padR,slot=pw/cols.length,bw=Math.min(24,slot*.45),sc=ph/max;
  let g='<g class="grid">';
  for(let i=0;i<=steps;i++){const y=top+ph-ph*i/steps;g+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'"/>';}
  g+='</g>';
  for(let i=0;i<=steps;i++){const y=top+ph-ph*i/steps;g+='<text x="'+(padL-6)+'" y="'+(y+4)+'" text-anchor="end" class="ax">'+tk(max*i/steps)+'</text>'}
  cols.forEach((c,i)=>{
    const cx=padL+slot*i+slot/2;let y=top+ph;
    series.forEach(s=>{const n=c.v[s.k]||0;if(!n)return;const h=n*sc;
      g+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(y-h).toFixed(1)+'" width="'+bw+'" height="'+Math.max(h-2,2).toFixed(1)+'" rx="3" style="fill:var(--'+s.c+')" data-tip="'+esc(c.label+' · '+s.label+': '+f(n))+'"/>';y-=h});
    g+='<text x="'+cx+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle" class="lab">'+f(totals[i])+'</text>';
    g+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" class="ax2">'+esc(c.label)+'</text>';
  });
  g+='<line x1="'+padL+'" y1="'+(top+ph)+'" x2="'+(W-padR)+'" y2="'+(top+ph)+'" class="axl"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="'+esc(o.aria||'Biểu đồ cột')+'">'+g+'</svg>';
}
function chartTable(items,series,f){
  f=f||(x=>String(x));
  return '<div class="tablewrap"><table><thead><tr><th></th>'+series.map(s=>'<th>'+esc(s.label)+'</th>').join('')+'</tr></thead><tbody>'+items.map(r=>'<tr><td>'+esc(r.label)+'</td>'+series.map(s=>'<td>'+f(r.v[s.k]||0)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
function chartCard(key,title,sub,items,series,kind,o){
  o=o||{};const tv=S.tv[key],ci=CHART_ICON[key]||['chart','blue'];
  const svg=kind==='v'?barsV(items,series,o):barsH(items,series,o);
  return '<div class="card"><div class="card-h"><div class="chh">'+ichip(ci[0],ci[1])+'<h2>'+title+'</h2><small>'+sub+'</small></div><button class="link" data-a="tv" data-v="'+key+'">'+(tv?'Xem biểu đồ':'Xem bảng')+'</button></div><div class="card-b">'+(series.length>1?legend(series):'')+(tv?chartTable(items,series,o.fmt):svg)+(o.mock?'<div class="note-mock">Dữ liệu minh họa.</div>':'')+'</div></div>';
}

  const total=list.length,pages=Math.max(1,Math.ceil(total/size));
  const p=Math.min(Math.max(S.pg[key]||1,1),pages);S.pg[key]=p;
  const from=total?(p-1)*size+1:0,to=Math.min(p*size,total);
  let nums='';
  for(let i=1;i<=pages;i++)nums+='<button class="pgn '+(i===p?'on':'')+'" data-a="pg" data-k="'+key+'" data-v="'+i+'" aria-label="Trang '+i+'" '+(i===p?'aria-current="page"':'')+'>'+i+'</button>';
  const pager='<div class="pager"><span class="faint">Hiển thị '+from+'–'+to+' / '+total+'</span>'+(pages>1?'<div class="pgbtns"><button class="pgn" data-a="pg" data-k="'+key+'" data-v="prev" '+(p===1?'disabled':'')+' aria-label="Trang trước">'+ic('chevron',13).replace('<svg','<svg style="transform:rotate(180deg)"')+'</button>'+nums+'<button class="pgn" data-a="pg" data-k="'+key+'" data-v="next" '+(p===pages?'disabled':'')+' aria-label="Trang sau">'+ic('chevron',13)+'</button></div>':'')+'</div>';
  return {items:list.slice((p-1)*size,p*size),pager:pager};
}

function feedItems(){
  const arr=[];TASKS.forEach(t=>S.tasks[t.id].log.forEach(l=>arr.push({t:l.t,text:l.text,title:t.title})));
  return arr.sort((a,b)=>b.t.localeCompare(a.t)).slice(0,5);
}
function lrow(t,idx){
  const s=st(t.id),unl=blocksCount(t.id),deps=t.prereq.filter(p=>st(p)!=='DONE');
  let hint='';
  if(s==='LOCKED'){const parts=[];if(deps.length)parts.push('Cần xong: '+deps.map(p=>TMAP[p].title).join(', '));if(t.day>S.today)parts.push('Mở vào '+dayOf(t.day).name);hint='<span class="hint lock">'+ic('lock',12)+'<span>'+esc(parts.join(' · '))+'</span></span>'}
  else if(s==='WAITING_EXTERNAL')hint='<span class="hint warn">'+ic('hourglass',12)+'<span>'+esc(t.waitLabel||'Đang chờ bên ngoài')+'</span></span>';
  else if(s==='WAITING_APPROVAL')hint='<span class="hint warn">'+ic('hourglass',12)+'<span>Chờ mentor duyệt</span></span>';
  else if(s==='BLOCKED')hint='<span class="hint crit">'+ic('alert',12)+'<span>'+esc(S.tasks[t.id].reason)+'</span></span>';
  return '<button class="lrow '+s+'" data-a="openTask" data-v="'+t.id+'" title="'+esc(CATMAP[t.cat].name+' · '+COMPLETION[t.completion])+'">'+(idx?'<span class="num">'+idx+'</span>':glyph(s))+'<span class="bd"><b>'+esc(t.title)+'</b><span class="mt2">'+t.minutes+' phút'+(S.view==='tasks'&&t.day>0&&t.day<S.dayView&&S.dayView===S.today?' · Tồn từ '+dayOf(t.day).name:'')+'</span>'+hint+'</span>'+pill(s)+ic('chevron',14)+'</button>';
}

function viewProgress(){

  const cnt=k=>main.filter(t=>SGROUP[k].includes(st(t.id))).length;

  const hrs=x=>(Math.round(x*10)/10)+' giờ';
  const minCols=DAYS.map(D=>{const ts=dayTasks(D.n);const done=ts.filter(t=>st(t.id)==='DONE').reduce((a,t)=>a+t.minutes,0);const left=ts.filter(t=>st(t.id)!=='DONE').reduce((a,t)=>a+t.minutes,0);return {label:D.name,v:{done:done/60,left:left/60}}});
  const minSeries=[{k:'done',c:'c-done',label:'Đã xong'},{k:'left',c:'c-wait',label:'Còn lại'}];
  const typeRows=['SELF_CONFIRM','EVIDENCE_REQUIRED','OWNER_APPROVAL'].map(k=>({label:COMPLETION[k],v:{n:main.filter(t=>t.completion===k).length}}));
  return '<div class="pagehead"><div>'+phi('chart','teal')+'<h1>Tiến độ chi tiết</h1><p>Tổng hợp việc theo ngày, khối lượng và cách xác nhận hoàn thành.</p></div></div>'
   +'<div class="grid g4">'+kpi('Tiến độ tuần đầu',p.pct+'%',p.done+'/'+p.total+' việc bắt buộc đã xong',{hero:true,meter:p.pct,icon:'chart',tone:'blue'})+kpi('Làm được ngay',cnt('doing'),'Ước tính còn '+fmtMin(rem),{icon:'check',tone:'teal'})+kpi('Đang chờ',cnt('wait'),'Chờ phản hồi bên ngoài hoặc chờ duyệt',{icon:'hourglass',tone:'amber'})+kpi('Đang khóa',cnt('lock'),'Mở khi xong tiên quyết hoặc đến ngày',{icon:'lock',tone:'slate'})+'</div>'
   +'<div class="grid g2 mt">'+chartCard('state','Trạng thái việc theo ngày','Số việc bắt buộc mỗi ngày, theo trạng thái',dayRows,STATE_SERIES,'h',{W:520,padL:76,aria:'Trạng thái việc theo ngày'})
   +chartCard('min','Khối lượng theo ngày','Ước tính số giờ làm, đã xong và còn lại',minCols,minSeries,'v',{W:520,fmt:hrs,aria:'Khối lượng ước tính theo ngày'})+'</div>'
   +'<div class="grid g2 mt">'+chartCard('type','Cách xác nhận hoàn thành','Số việc theo cách xác nhận',typeRows,[{k:'n',c:'c-doing',label:'Số việc'}],'h',{W:520,padL:110,aria:'Số việc theo cách xác nhận'})
   +'<div class="card"><div class="card-h"><div class="chh">'+ichip('history','slate')+'<h2>Hoạt động gần đây</h2></div></div><div class="card-b"><div class="timeline">'+feedItems().map(f=>'<div><i></i><span>'+esc(f.text)+'<br><small class="faint">'+f.t+' · '+esc(f.title)+'</small></span></div>').join('')+'</div></div></div></div>';

const DAY_ORDER=[1,2,3,0];
function viewTasks(){
  const q=S.q.trim().toLowerCase();
  if(q){
    const res=TASKS.filter(t=>t.title.toLowerCase().includes(q)||CATMAP[t.cat].name.toLowerCase().includes(q));
    return '<div class="pagehead"><div>'+phi('search','slate')+'<h1>Kết quả tìm kiếm</h1><p>'+res.length+' việc phù hợp với "'+esc(S.q)+'"</p></div></div><div class="card"><div class="card-b flush">'+(res.length?res.map(t=>lrow(t,0)).join(''):'<div class="faint" style="padding:16px">Không tìm thấy việc phù hợp.</div>')+'</div></div>';
  }
  const n=S.dayView,D=dayOf(n),k=dayKind(n),s0=dayStat(n);
  const oi=DAY_ORDER.indexOf(n),prev=DAY_ORDER[oi-1],next=DAY_ORDER[oi+1];
  const own=TASKS.filter(t=>t.day===n&&(n===0||t.required)&&st(t.id)!=='NOT_APPLICABLE');
  const carry=n===S.today?TASKS.filter(t=>t.day>0&&t.day<n&&t.required&&!['DONE','NOT_APPLICABLE'].includes(st(t.id))):[];
  const list=carry.concat(own);
  const open=own.filter(t=>['READY','IN_PROGRESS','BLOCKED'].includes(st(t.id)));
  const mins=open.concat(carry).reduce((a,t)=>a+t.minutes,0);
  const banner=k==='future'?'<div class="note warn mt">'+ic('clock',15)+'<span>'+D.name+' bắt đầu vào '+dayLabel(n)+'. Bạn xem trước được nội dung, nhưng chỉ làm được khi đến ngày và đã xong việc tiên quyết.</span></div>':(n>1?'<div class="note mt">'+ic('shield',15)+'<span>Nội dung '+D.name+' là bản mẫu, mentor/HR sẽ xác nhận nội dung thật.</span></div>':'');
  const pct=s0.total?Math.round(s0.done*100/s0.total):0;
  const nav=(v,dir)=>'<button class="ibtn" data-a="openDay" data-v="'+(v===undefined?'':v)+'" '+(v===undefined?'disabled':'')+' aria-label="'+(dir<0?'Ngày trước':'Ngày sau')+'"><span style="display:inline-flex;'+(dir<0?'transform:rotate(180deg)':'')+'">'+ic('chevron',15)+'</span></button>';

const DAY_OPTS=[[1,'Ngày 1'],[2,'Ngày 2'],[3,'Ngày 3–5'],[0,'Khi cần']];
function hrState(){
  if(!S.hr){
    S.hr={seq:0,removed:[],docsRemoved:[],tq:'',tday:'all',tcomp:'all',dq:'',dkind:'all',dstatus:'all',
      tasks:TASKS.map(t=>({id:t.id,title:t.title,day:t.day,cat:t.cat,required:!!t.required,completion:t.completion,minutes:t.minutes,prereq:t.prereq.slice(),contact:t.contact,link:t.link||'',tpl:t.tpl||'',why:t.why||'',doneWhen:t.doneWhen||'',steps:((GUIDE[t.id]&&GUIDE[t.id].steps)||[]).map(x=>x.t),sample:!!t.sample,apply:({t5:'loc',t5b:'loc',f1:'exc',f2:'exc',f3:'exc'})[t.id]||'all',state:'published'})),
      docs:DOCS.map(d=>({id:d.id,name:d.name,type:d.type,size:d.size,updated:d.updated,owner:d.owner,cat:DOC_CAT[d.id]||'Quy trình',desc:d.desc,status:'published',ver:'1.'+(d.id.length%3),hist:[{ver:'1.0',date:d.updated,by:d.owner,note:'Bản đăng đầu tiên'}],attach:docUsed(d).map(t=>t.id),body:d.body})),
      versions:[{v:'v3',state:'Đang áp dụng',date:'18/09/2026',n:TASKS.length,by:'Content owner (HR)'},{v:'v2',state:'Đã thay thế',date:'10/09/2026',n:11,by:'Content owner (HR)'},{v:'v1',state:'Đã thay thế',date:'02/09/2026',n:8,by:'Content owner (HR)'}]};
  }
  return S.hr;
}
const hrTask=id=>hrState().tasks.find(t=>t.id===id);
const hrDeps=id=>hrState().tasks.filter(t=>t.prereq.includes(id));
function hrCycle(tasks){
  const m={};tasks.forEach(t=>{m[t.id]=t});const vis={},stk={};let cyc=false;
  const dfs=id=>{if(cyc||!m[id])return;if(stk[id]){cyc=true;return}if(vis[id])return;vis[id]=1;stk[id]=1;m[id].prereq.forEach(dfs);stk[id]=0};
  tasks.forEach(t=>dfs(t.id));return cyc;
}
function hrChanges(){const H=hrState();return H.tasks.filter(t=>t.state!=='published').length+H.removed.length+H.docs.filter(d=>d.status!=='published').length+H.docsRemoved.length}
function hrValidation(){
  const H=hrState(),ids=new Set(H.tasks.map(t=>t.id)),out=[];
  H.tasks.forEach(t=>{
    t.prereq.forEach(p=>{if(!ids.has(p))out.push({lv:'crit',x:'"'+t.title+'": tiên quyết không tồn tại ('+p+').'})});
    if(!t.doneWhen.trim())out.push({lv:'block',x:'"'+t.title+'": chưa có điều kiện hoàn thành.'});
    if(t.contact&&(!S.contacts[t.contact]||S.contacts[t.contact].status!=='APPROVED'))out.push({lv:'block',x:'"'+t.title+'": đầu mối '+t.contact+' chưa được duyệt.'});
    if(t.link&&(!S.links[t.link]||S.links[t.link].status!=='APPROVED'))out.push({lv:'block',x:'"'+t.title+'": link '+t.link+' chưa được duyệt.'});
  });
  if(hrCycle(H.tasks))out.push({lv:'crit',x:'Có phụ thuộc vòng tròn giữa các task.'});
  H.docs.forEach(d=>{if(d.status==='draft')out.push({lv:'info',x:'Tài liệu "'+d.name+'" là bản nháp; sẽ được đăng khi publish.'})});
  return out;
}
const hrBlocking=v=>v.some(i=>i.lv==='crit'||i.lv==='block');
function hrPublished(){
  const H=hrState(),cur=S.version.published;
  H.versions.unshift({v:cur,state:'Đang áp dụng',date:fmtDate(new Date()),n:H.tasks.length,by:'Content owner (HR)'});
  if(H.versions[1])H.versions[1].state='Đã thay thế';
  H.tasks.forEach(t=>{t.state='published'});H.docs.forEach(d=>{d.status='published'});H.removed=[];H.docsRemoved=[];
  const n=+String(cur).replace(/\D/g,'')||3;S.version.draft='v'+(n+1);S.version.draftPublished=false;
}

/* ---------- Modal: header và footer cố định, có icon ---------- */
const MODAL_ICON={htask:['edit','blue'],hdel:['trash','rose'],hdoc:['upload','indigo'],hdocview:['file','indigo'],hddel:['trash','rose'],hreg:['link','teal'],hrdel:['trash','rose'],taskc:['list','blue'],publish:['send','indigo'],nudge:['mail','teal'],doc:['file','indigo'],viga:['spark','indigo'],how:['info','blue'],block:['alert','rose'],auser:['user','blue'],apw:['key','amber'],asusp:['lock','rose'],aimport:['upload','indigo'],ddept:['building','indigo'],dview:['building','indigo'],amem:['users','teal'],arch:['folder','amber'],mdel:['trash','rose']};
function fixModals(){
  const m=document.querySelector('.overlay .modal');if(!m||m.dataset.fx)return;m.dataset.fx='1';
  const kids=[...m.children];if(!kids.length)return;
  const h0=kids[0],h2=h0.tagName==='H2'?h0:h0.querySelector('h2');
  const title=h2?h2.textContent:'';let sub='';
  const sb=h0.tagName==='H2'?null:h0.querySelector('.faint');if(sb)sub=sb.textContent;
  let rest=kids.slice(1);
  if(rest[0]&&rest[0].classList&&rest[0].classList.contains('faint')&&!sub){sub=rest[0].textContent;rest=rest.slice(1)}
  else if(rest[0]&&rest[0].classList&&rest[0].classList.contains('faint')&&rest[0].getAttribute('style')&&/margin-bottom:10px/.test(rest[0].getAttribute('style'))){rest=rest.slice(1)}
  let foot=null;const last=rest[rest.length-1];
  if(last&&last.classList&&last.classList.contains('row')&&last.querySelector(':scope>.btn')&&!last.querySelector('input,textarea,select'))foot=rest.pop();
  const type=(S.modal&&S.modal.type)||'',ico=MODAL_ICON[type]||['info','blue'];
  const hd=document.createElement('div');hd.className='mhead';
  hd.innerHTML=ichip(ico[0],ico[1])+'<div class="mt"><h2>'+esc(title)+'</h2>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</div><button class="ibtn" data-a="modalClose" aria-label="Đóng">'+ic('x',15)+'</button>';
  const bd=document.createElement('div');bd.className='mbody';rest.forEach(k=>bd.appendChild(k));
  const ft=document.createElement('div');ft.className='mfoot';
  if(foot){[...foot.children].forEach(k=>ft.appendChild(k))}else{ft.innerHTML='<button class="btn sec" data-a="modalClose">Đóng</button>'}
  m.innerHTML='';m.appendChild(hd);m.appendChild(bd);m.appendChild(ft);
}

function railTrack(s){
  if(s==='NOT_APPLICABLE')return '<p class="faint" style="margin-bottom:12px">Không áp dụng cho bạn.</p>';
  const steps=['Sẵn sàng','Đang làm','Chờ xác nhận','Hoàn thành'];
  const idx={LOCKED:-1,READY:0,IN_PROGRESS:1,BLOCKED:1,WAITING_EXTERNAL:2,WAITING_APPROVAL:2,DONE:3}[s];
  return '<ul class="vsteps">'+steps.map((x,i)=>{let c=i<idx?'past':i===idx?(s==='BLOCKED'?'bad':'cur'):'';if(s==='DONE')c='past';return '<li class="'+c+'"><i></i>'+(i===idx&&s==='BLOCKED'?'Đang kẹt':x)+'</li>'}).join('')+'</ul>';
}

  if(s==='BLOCKED')return '<div class="note crit">'+ic('alert',15)+'<span>Đang kẹt: <b>'+esc(T.reason)+'</b>. Mentor thấy task này trong danh sách cần chú ý.</span></div><button class="btn block" style="margin-top:10px" data-a="unblock" data-v="'+t.id+'">Đã gỡ kẹt, tiếp tục</button>';

function docsFiltered(){
  const q=S.docQ.trim().toLowerCase();
  return DOCS.filter(d=>{
    const used=docUsed(d).length>0;
    if(S.docKind==='task'&&!used)return false;
    if(S.docKind==='extra'&&used)return false;
    if(S.docCat!=='all'&&DOC_CAT[d.id]!==S.docCat)return false;
    return !q||d.name.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q);
  });
}
function docsTable(){
  const pg=paginate('docs',docsFiltered(),6);
  const rows=pg.items.map(d=>{
    const used=docUsed(d);
    return '<tr><td><div class="cellrow">'+ichip('file',({'Hồ sơ':'blue','Đào tạo':'indigo','Thiết bị':'teal','Bảo mật':'rose','Văn phòng':'amber','Quy trình':'slate'})[DOC_CAT[d.id]]||'blue')+'<div><b style="font-weight:600">'+esc(d.name)+'</b><div class="faint">'+esc(d.desc)+'</div></div></div></td>'
     +'<td style="white-space:nowrap">'+d.type+' · '+d.size+'</td><td><span class="tag">'+DOC_CAT[d.id]+'</span></td>'
     +'<td><div class="cellrow" style="gap:8px">'+ichip('building','slate',1)+'<span>'+esc(d.owner)+'</span></div></td><td style="white-space:nowrap">'+d.updated+'</td>'
     +'<td style="min-width:200px">'+(used.length?'<div class="stack" style="gap:4px;align-items:flex-start"><span class="tag">Đính kèm task</span>'+used.map(u=>'<button class="link" data-a="openTask" data-v="'+u.id+'">'+esc(cut(u.title,28))+'</button>').join('')+'</div>':'<span class="tag sample">Đọc thêm</span>')+'</td>'
     +'<td><button class="btn sec sm" data-a="openDoc" data-v="'+d.id+'">'+ic('file',13)+' Đọc</button></td></tr>';

/* ======================= Mentor ======================= */
function teamRows(){
  const cur=currentTaskOf(),p=progress();
  const me={name:PROFILE.name,id:PROFILE.id,day:S.today,pct:p.pct,status:cur?st(cur.id):'DONE',task:cur?cur.title:'Hoàn tất',since:'hôm nay',note:'',me:true};
  return [me].concat(S.others.map((o,i)=>Object.assign({idx:i},o)));
}
const needsAttn=r=>['BLOCKED','WAITING_APPROVAL'].includes(r.status);
function teamFiltered(){
  const q=S.teamQ.trim().toLowerCase(),f=S.teamF;
  return teamRows().filter(r=>(f==='all'||(f==='attn'&&needsAttn(r))||(f==='wait'&&['WAITING_APPROVAL','WAITING_EXTERNAL'].includes(r.status))||(f==='ok'&&!needsAttn(r)))&&(!q||r.name.toLowerCase().includes(q)||r.id.toLowerCase().includes(q)));
}
function teamTableHtml(rows,key,size){
  const pg=key?paginate(key,rows,size):{items:rows,pager:'<div class="pager"><span class="faint">'+rows.length+' nhân viên</span></div>'};
  const body=pg.items.map(r=>'<tr><td style="min-width:170px"><div class="cellrow">'+avI(r.name)+'<div><b style="font-weight:600">'+esc(r.name)+'</b><div class="faint">'+r.id+'</div></div></div></td><td>'+(r.day===3?'Ngày 3–5':'Ngày '+r.day)+'</td>'
    +'<td style="min-width:130px"><div class="meter" style="margin:0 0 3px"><i style="width:'+r.pct+'%;background:'+(r.status==='BLOCKED'?'var(--c-block)':'var(--c-doing)')+'"></i></div><span class="faint">'+r.pct+'%</span></td>'
    +'<td style="min-width:220px">'+esc(r.task)+'<div class="faint">'+esc(r.note||'')+(r.since?(r.note?' · ':'')+r.since:'')+'</div></td><td>'+pill(r.status)+'</td>'
    +'<td style="white-space:nowrap"><button class="btn sec sm" data-a="mTask" data-v="'+esc(r.task)+'">'+ic('eye',13)+' Xem task</button> <button class="btn sec sm" data-a="nudgeModal" data-v="'+(r.me?'me':r.idx)+'">'+ic('mail',13)+' Nhắn</button></td></tr>').join('');
  return '<div class="tablewrap"><table><thead><tr><th>Nhân viên</th><th>Giai đoạn</th><th>Tiến độ</th><th>Task hiện tại</th><th>Trạng thái</th><th></th></tr></thead><tbody>'
    +(body||'<tr><td colspan="6" class="faint" style="padding:18px">Không có nhân viên phù hợp.</td></tr>')+'</tbody></table></div>'+pg.pager;
}

  const prog=rows.slice().sort((a,b)=>b.pct-a.pct).map(r=>({label:r.name,v:r.status==='BLOCKED'?{bad:r.pct}:{ok:r.pct}}));
  const byDay=[1,2,3].map(n=>{const rr=rows.filter(r=>r.day===n);return {label:dayOf(n).name,v:{ok:rr.filter(r=>!needsAttn(r)).length,attn:rr.filter(needsAttn).length}}});
  const th=threads().slice(0,3);
  const recent=th.map(t=>{const last=t.msgs[t.msgs.length-1],isNew=t.msgs.some(m=>m.who==='employee'&&!m.read);

  return '<div class="pagehead hero"><div>'+phav('Phạm Đức Long')+'<h1>Tổng quan nhân viên phụ trách</h1><p>Biết ai đang kẹt ở bước nào mà không phải nhắc lại từng việc. Dữ liệu người khác là minh họa.</p></div></div>'
   +'<div class="grid g4">'+kpi('Đang phụ trách',rows.length,'nhân viên mới',{icon:'users',tone:'blue'})+kpi('Cần chú ý',attn.length,'đang kẹt hoặc chờ bạn duyệt',{icon:'alert',tone:'rose'})+kpi('Chờ duyệt',pendingApprovals(),'task loại "Owner duyệt"',{icon:'hourglass',tone:'amber'})+kpi('Tiến độ trung bình',avg+'%','việc bắt buộc, tuần đầu',{icon:'chart',tone:'teal',meter:avg})+'</div>'
   +'<div class="grid g2 mt">'
   +chartCard('m1','Tiến độ từng nhân viên','Phần trăm việc bắt buộc đã xong; đỏ là đang kẹt',prog,[{k:'ok',c:'c-doing',label:'Bình thường'},{k:'bad',c:'c-block',label:'Đang kẹt'}],'h',{W:520,max:100,fmt:x=>x+'%',padL:118,aria:'Tiến độ từng nhân viên'})
   +chartCard('m2','Nhân viên theo ngày onboarding','Số người mỗi giai đoạn, tách người cần chú ý',byDay,[{k:'ok',c:'c-doing',label:'Bình thường'},{k:'attn',c:'c-block',label:'Cần chú ý'}],'v',{W:520,aria:'Nhân viên theo ngày onboarding'})+'</div>'
   +'<div class="grid g21 mt"><div class="card"><div class="card-h"><div class="chh">'+ichip('alert','rose')+'<h2>Cần chú ý ngay</h2><small>Đang kẹt hoặc chờ bạn duyệt</small></div><button class="link" data-a="nav" data-v="m-approve">Xem hàng chờ duyệt</button></div><div class="card-b flush">'+(attn.length?teamTableHtml(attn,null):'<div class="faint" style="padding:16px">Không có nhân viên nào cần chú ý.</div>')+'</div></div>'
   +'<div class="card"><div class="card-h"><div class="chh">'+ichip('msg','teal')+'<h2>Trao đổi gần đây</h2><small>Bình luận hai chiều với nhân viên</small></div><button class="link" data-a="nav" data-v="m-msgs">Xem tất cả</button></div><div class="card-b flush">'+recent+'</div></div></div>';
}

   +(pg.items.length?pg.items.map(x=>'<tr><td><div class="cellrow">'+avI(x.who)+'<b style="font-weight:600">'+esc(x.who)+'</b></div></td><td><div class="cellrow">'+ichip('shield','indigo')+'<div>'+esc(x.task)+'<div>'+pill('WAITING_APPROVAL')+'</div></div></div></td><td class="muted">'+esc(x.rule)+'</td><td>'+esc(x.ev||'-')+'</td><td style="white-space:nowrap"><button class="btn sm" data-a="approve" data-v="'+x.key+'">'+ic('check',13)+' Duyệt</button> <button class="btn sec sm" data-a="reject" data-v="'+x.key+'">Yêu cầu bổ sung</button> <button class="btn sec sm" data-a="mTask" data-v="'+esc(x.task)+'">'+ic('eye',13)+' Xem task</button> <button class="btn sec sm" data-a="nudgeModal" data-v="'+x.nud+'" aria-label="Nhắn">'+ic('mail',13)+'</button></td></tr>').join(''):'<tr><td colspan="5" class="faint" style="padding:18px">Không có mục nào cần duyệt.</td></tr>')

function viewMsgs(){
  const all=threads();
  const isNewT=t=>t.msgs.some(m=>m.who==='employee'&&!m.read);
  const list=all.filter(t=>S.mfilter==='unread'?isNewT(t):true);
  const pg=paginate('thr',list,3);
  const chip=(k,l)=>'<button class="chip '+(S.mfilter===k?'on':'')+'" data-a="mfilter" data-v="'+k+'">'+l+'</button>';
  const cards=pg.items.map(t=>{
    const idx=all.indexOf(t),nw=isNewT(t);
    const stt=t.task?st(t.task):((S.others.find(o=>o.id===t.emp)||{}).status||'IN_PROGRESS');
    return '<div class="card"><div class="card-h"><div class="cellrow" style="gap:12px">'+avI(empName(t.emp),36)+'<div><h2>'+esc(empName(t.emp))+(nw?' <span class="tag sample" style="height:18px">Mới</span>':'')+'</h2><small>'+esc(t.label)+'</small></div></div>'+pill(stt)+'</div><div class="card-b"><div class="thread">'+t.msgs.map(m=>cmt(m,m.who==='employee'&&!m.read)).join('')+'</div>'
     +'<div class="cbox"><textarea id="mr-'+idx+'" placeholder="Trả lời '+esc(empName(t.emp))+'..." aria-label="Trả lời"></textarea><div class="row" style="justify-content:flex-end"><button class="btn sm" data-a="replyThread" data-v="'+idx+'">'+ic('send',13)+' Gửi</button></div></div></div></div>';
  }).join('');
  const unreadCount=all.filter(isNewT).length;
  S.msgs.forEach(m=>{if(m.who==='employee')m.read=true});
  return '<div class="pagehead"><div>'+phi('msg','teal')+'<h1>Trao đổi</h1><p>Bình luận hai chiều với nhân viên theo từng task. Nhân viên thấy tin của bạn ở trang task và trong thông báo.</p></div></div>'
   +'<div class="chips" style="margin-bottom:12px">'+chip('all','Tất cả ('+all.length+')')+chip('unread','Chưa đọc ('+unreadCount+')')+'</div>'
   +'<div class="stack">'+(cards||'<div class="card"><div class="card-b faint" style="padding-top:16px">Không có cuộc trao đổi nào.</div></div>')+'</div><div class="card mt">'+pg.pager+'</div>';
}

  if(m.type==='nudge'){
    const me=m.emp==='me',o=me?null:S.others[+m.emp],nm=me?PROFILE.name:o.name,cur=currentTaskOf();

function render(){

  document.getElementById('root').innerHTML=S.auth?viewShell():(S.gate==='login'?viewLogin():viewLandingPortal());

    case 'pg':{const k=el.dataset.k,cur=S.pg[k]||1;S.pg[k]=v==='prev'?cur-1:v==='next'?cur+1:+v;render();break;}

      else{S.others[+n].status='IN_PROGRESS';toast('Đã yêu cầu bổ sung.');render()}break;}

/* Mở thẳng một trạng thái bằng hash: #auth=1&role=employee&view=task&id=t6&day=1&today=2&do=t6&chat=1&q=...&modal=viga&dark=1&tv=state */
(function(){
  const raw=location.hash.replace(/^#/,'');if(!raw)return;
  const p=new URLSearchParams(raw);
  if(p.get('dark'))S.dark=true;
  if(p.get('gate'))S.gate=p.get('gate');
  if(p.get('auth')){S.auth=true;S.role=p.get('role')||'employee';S.view=p.get('view')||landing(S.role)}
  (p.get('do')||'').split('|').filter(Boolean).forEach(id=>{transition(id,'IN_PROGRESS');transition(id,'DONE',{actor:'user',evidence:'Minh chứng mẫu'})});
  if(p.get('today')){S.today=+p.get('today');refreshLocks()}
  if(p.get('day'))S.dayView=+p.get('day');
  if(p.get('id'))S.taskId=p.get('id');
  if(p.get('ttab'))S.ttab=p.get('ttab');
  if(p.get('ai'))aiPrepare(p.get('ai'));
  if(p.get('tv'))p.get('tv').split('|').forEach(k=>{S.tv[k]=true});
  if(p.get('modal')==='viga')S.modal={type:'viga'};
  if(p.get('chat')){S.chatOpen=true;(p.get('q')||'').split('|').filter(Boolean).forEach(q=>{S.chat.push({role:'user',text:q});S.chat.push({role:'bot',r:ask(q)})})}
})();
render();
</script>

function uniqueCode(label,obj){
  let b=label.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/Đ/g,'D').replace(/[^A-Z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,24)||'MOI';
  let c=b,i=2;while(obj[c])c=b+'_'+(i++);return c;
}

const nodeCls=t=>t.state==='new'?'ready':t.state==='edited'?'wait':'done';

     +'<div class="rs">'+stateTag(t.state)+'<div class="rowact"><button class="ibtn sm" data-a="viewTaskC" data-v="'+t.id+'" aria-label="Xem" title="Xem như nhân viên">'+ic('eye',13)+'</button><button class="ibtn sm" data-a="htEdit" data-v="'+t.id+'" aria-label="Sửa" title="Sửa">'+ic('edit',13)+'</button><button class="ibtn sm" data-a="htDup" data-v="'+t.id+'" aria-label="Nhân bản" title="Nhân bản">'+ic('copy',13)+'</button><button class="ibtn sm danger" data-a="htDelAsk" data-v="'+t.id+'" aria-label="Xóa" title="Xóa">'+ic('trash',13)+'</button></div></div></li>';

NEWCLICK.htSave2=v=>{
  const H=hrState(),title=val('ht-title').trim();
  if(!title){toast('Hãy nhập tên task.');return}
  let contact=val('ht-contact'),link=val('ht-link');
  const ncl=val('nc-label').trim(),nlt=val('nl-title').trim();
  if(ncl){contact=uniqueCode(ncl,S.contacts);S.contacts[contact]={label:ncl,value:'',role:val('nc-role').trim(),status:'DRAFT'}}
  if(nlt){link=uniqueCode(nlt,S.links);S.links[link]={title:nlt,kind:'',purpose:val('nl-purpose').trim(),when:val('nl-when').trim(),prepare:'',status:'DRAFT'}}
  const old=v?H.tasks.find(x=>x.id===v):null;
  const draft={id:v||'x'+(++H.seq),title:title,day:+val('ht-day'),cat:val('ht-cat'),required:document.getElementById('ht-req').checked,completion:val('ht-comp'),minutes:Math.max(1,parseInt(val('ht-min'),10)||15),prereq:[...document.querySelectorAll('.ht-pre:checked')].map(x=>x.value),apply:val('ht-apply'),contact:contact,link:link,tpl:val('ht-tpl'),why:val('ht-why').trim(),doneWhen:val('ht-done').trim(),steps:val('ht-steps').split('\n').map(x=>x.trim()).filter(Boolean),src:old?old.src:[]};
  if(hrCycle(H.tasks.filter(t=>t.id!==draft.id).concat([draft]))){toast('Không lưu được: tiên quyết này tạo vòng tròn giữa các task.');return}
  if(old)Object.assign(old,draft,{state:old.state==='new'?'new':'edited'});else{draft.state='new';draft.sample=false;H.tasks.push(draft)}
  const obj=old||draft;let n=parseInt(val('ht-order'),10);if(!(n>=1))n=H.tasks.indexOf(obj)+1;n=Math.min(n,H.tasks.length);
  const cur=H.tasks.indexOf(obj);if(cur!==n-1){H.tasks.splice(cur,1);H.tasks.splice(n-1,0,obj);if(obj.state==='published')obj.state='edited'}
  S.modal=null;toast(old?'Đã lưu thay đổi vào bản nháp.':'Đã thêm task vào bản nháp.');
};

function ai2Check(A){
  const live=A.tasks.filter(t=>t.status==='accepted'||t.status==='edited'),keys=new Set(live.map(t=>t.k)),out=[];
  live.forEach(t=>{
    t.prereq.forEach(p=>{if(!keys.has(p)){const x=A.tasks.find(y=>y.k===p);out.push({lv:'crit',x:'"'+t.title+'" cần "'+(x?x.title:p)+'" nhưng task đó chưa được chấp nhận.'})}});

const RD_LBL={done:'Hoàn thành',ready:'Sẵn sàng',doing:'Đang làm',wait:'Đang chờ',lock:'Đang khóa',over:'Trễ hạn'};
const _vt7=viewTasks;
viewTasks=function(){
  if(S.q.trim())return _vt7();
  const n=S.dayView,D=dayOf(n);
  const own=TASKS.filter(t=>t.day===n&&(n===0||t.required)&&st(t.id)!=='NOT_APPLICABLE');
  const carry=n===S.today?TASKS.filter(t=>t.day>0&&t.day<n&&t.required&&!['DONE','NOT_APPLICABLE'].includes(st(t.id))):[];
  const list=carry.concat(own);
  const chips=DAYX.map(d=>{const s0=dayStat(d.n);return '<button class="dchip '+(d.n===n?'on':'')+'" data-a="openDay" data-v="'+d.n+'"><b>'+(d.n===0?'Khi cần':d.name)+'</b><small>'+s0.done+'/'+s0.total+'</small></button>'}).join('');
  const RH=118,TOP=70,H=list.length*RH+TOP;
  const xs=list.map((_,i)=>i%2===0?24:76);
  let d='M '+xs[0]*10+' 0 L '+xs[0]*10+' '+TOP;
  for(let i=1;i<list.length;i++){const y0=TOP+(i-1)*RH,y1=TOP+i*RH,ym=(y0+y1)/2;d+=' C '+xs[i-1]*10+' '+ym+' '+xs[i]*10+' '+ym+' '+xs[i]*10+' '+y1}
  if(list.length)d+=' L '+xs[list.length-1]*10+' '+H;
  const dots=list.slice(1).map((_,i)=>{const y=TOP+i*RH+RH/2;return '<i class="rdot" style="top:'+y+'px;background:'+['#f2c14e','#3fc1c9','#ea5a5a','#ffffff'][i%4]+'"></i>'}).join('');
  const nodes=list.map((t,i)=>{
    const ns=nodeState(t),s=st(t.id),col=RD_COL[ns],y=TOP+i*RH,left=xs[i]===24,ic0=NODE_ICON[ns];
    const label=(ns==='over'&&s!=='BLOCKED')?'Trễ hạn':RD_LBL[ns]||STATUS[s];
    return '<button class="rnode" data-a="openTask" data-v="'+t.id+'" style="left:'+xs[i]+'%;top:'+y+'px;--c:'+col+'" aria-label="Task '+(i+1)+': '+esc(t.title)+'"><span class="ring"><span class="in">'+(ic0?ic(ic0,22):(i+1))+'</span></span></button>'
     +'<button class="rpill '+(left?'r':'l')+'" data-a="openTask" data-v="'+t.id+'" style="top:'+y+'px;--c:'+col+';'+(left?'left:calc('+xs[i]+'% + 58px)':'right:calc('+(100-xs[i])+'% + 58px)')+'"><small>Task '+(i+1)+(carry.includes(t)?' · tồn từ '+dayOf(t.day).name:'')+'</small><b>'+esc(t.title)+'</b><em>'+label+'</em></button>';
  }).join('');
  const legend=['done','ready','wait','lock','over'].map(k=>'<span><i style="background:'+RD_COL[k]+'"></i>'+RD_LBL[k]+'</span>').join('');
  return '<div class="pagehead"><div>'+phi('list','blue')+'<h1>Nhiệm vụ của bạn</h1><p>'+esc(D.name)+' · '+esc(D.goal)+'</p></div><button class="btn sec" data-a="howModal">'+ic('info',14)+' Hướng dẫn thực hiện checklist</button></div>'
   +'<div class="dchips">'+chips+'</div>'
   +'<div class="roadmap" style="height:'+(H+30)+'px"><svg viewBox="0 0 1000 '+H+'" preserveAspectRatio="none" aria-hidden="true"><path d="'+d+'" class="rpath-shadow"/><path d="'+d+'" class="rpath"/></svg>'+dots+nodes+'</div>'
   +'<div class="rlegend">'+legend+'</div>';
};

  const wait=TASKS.filter(t=>['WAITING_EXTERNAL','WAITING_APPROVAL','BLOCKED'].includes(st(t.id)));

(function(){
  const R=[[/Nhập ghi chú \(ví dụ: đã nộp đủ, hoặc còn thiếu giấy nào\) vào ô "Ghi chú cho người duyệt" rồi bấm "Gửi để duyệt"\./,'Bấm "Tôi đã hoàn thành" khi đã nộp đủ, hoặc đã nói rõ còn thiếu giấy nào.'],[/vào ô "Ghi chú cho người duyệt" rồi bấm "Gửi để duyệt"/g,'rồi bấm "Tôi đã hoàn thành"'],[/Gửi kết quả để duyệt/g,'Ghi nhận kết quả'],[/Ghi điểm bài test và xác nhận đã làm khảo sát vào ô ghi chú, rồi bấm "Gửi để duyệt"\./,'Xác nhận đã làm khảo sát và bài test, rồi bấm "Tôi đã hoàn thành".'],[/rồi bấm "Gửi để duyệt" để Phòng nhân sự xác nhận/g,'rồi bấm "Tôi đã hoàn thành"'],[/Ghi ngày ký vào ô ghi chú rồi bấm "Gửi để duyệt"/g,'Bấm "Tôi đã hoàn thành" sau khi ký'],[/bấm "Gửi để duyệt"/g,'bấm "Tôi đã hoàn thành"']];
  const fx=s=>R.reduce((a,[r,y])=>a.replace(r,y),s);
  const walk=o=>{if(Array.isArray(o)){o.forEach((v,i)=>{if(typeof v==='string')o[i]=fx(v);else walk(v)})}else if(o&&typeof o==='object'){for(const k in o){if(typeof o[k]==='string')o[k]=fx(o[k]);else walk(o[k])}}};
  walk(GUIDE);
  Object.values(GUIDE).forEach(g=>{(g.faq||[]).forEach(q=>{if(/^Ai (duyệt|xác nhận)/.test(q[0])){q[0]='Ai xác nhận hoàn thành?';q[1]='Bạn tự bấm "Tôi đã hoàn thành" khi đủ điều kiện. HR theo dõi tiến độ.'}})});
  TASKS.forEach(t=>{if(t.doneWhen)t.doneWhen=t.doneWhen.replace(/;? ?Phòng (nhân sự|tuyển dụng) xác nhận[^.]*\./,'.')});
})();

/* Làm sạch dữ liệu mẫu còn nhắc "chờ duyệt" */
function cleanState(s){
  const fx=x=>String(x).replace(/,? ?đang chờ (mentor|owner|HR|mentor hoặc HR) duyệt/gi,'').replace(/Mình sẽ duyệt trong hôm nay/g,'Mình đã ghi nhận').replace(/Mentor sẽ xác nhận hoàn thành, bạn không cần[^.]*\./g,'');
  Object.values(s.tasks||{}).forEach(T=>{if(T.status==='WAITING_APPROVAL')T.status='IN_PROGRESS';(T.log||[]).forEach(l=>{l.text=fx(l.text)})});
  (s.msgs||[]).forEach(m=>{m.text=fx(m.text)});
  s.notifs=(s.notifs||[]).filter(n=>n.type!=='approval');
  (s.others||[]).forEach(o=>{if(o.status==='WAITING_APPROVAL'){o.status='IN_PROGRESS';o.note=''}});
}

railTrack=function(s){
  if(s==='NOT_APPLICABLE')return '<p class="faint" style="margin-bottom:12px">Không áp dụng cho bạn.</p>';
  const steps=['Sẵn sàng','Đang làm','Hoàn thành'];
  const idx={LOCKED:-1,READY:0,IN_PROGRESS:1,BLOCKED:1,WAITING_EXTERNAL:1,DONE:2}[s];
  return '<ul class="vsteps">'+steps.map((x,i)=>{let c=i<idx?'past':i===idx?(s==='BLOCKED'?'bad':'cur'):'';if(s==='DONE')c='past';return '<li class="'+c+'"><i></i>'+(i===idx&&s==='BLOCKED'?'Đang kẹt (đã báo sự cố)':x)+'</li>'}).join('')+'</ul>';
};

  3:{eyebrow:'PHASE 03',label:'Bắt đầu đóng góp',desc:'Hiểu công việc và hoàn thành đầu việc đầu tiên'},

const entStatus=s=>({DONE:'Hoàn thành',READY:'Sẵn sàng',IN_PROGRESS:'Đang thực hiện',WAITING_EXTERNAL:'Đang chờ',WAITING_APPROVAL:'Đang chờ',BLOCKED:'Đang kẹt',LOCKED:'Chưa mở',SKIPPED:'Đã bỏ qua',NOT_APPLICABLE:'Không áp dụng'}[s]||s);

viewTree=function(){

function stepMarkdownSource(step){
  if(step.markdown)return step.markdown;
  const blocks=[];
  if(step.d)blocks.push(step.d);
  if(step.subs&&step.subs.length)blocks.push(step.subs.map(x=>'- '+x).join('\n'));
  const note=step.note&&(step.note.x||step.note);
  if(note)blocks.push('> **Lưu ý:** '+note);
  return blocks.join('\n\n');
}

function aiRoadmapReview14(A){
  const tasks=A.tasks,pending=tasks.filter(t=>t.status==='pending').length,accepted=tasks.filter(t=>t.status==='accepted'||t.status==='edited').length,day=DAY_OPTS.find(d=>d[0]===+A.targetDay)||DAY_OPTS[0],ys=[230,178,218,166,208,248,196,158,202,236,184,222],sizes=[44,50,42,47,43,51,44,48,42,49,45,43],W=1000,Hc=430;
  const gap=tasks.length>1?860/(tasks.length-1):0,pts=tasks.map((t,i)=>({x:70+i*gap,xp:tasks.length>1?7+i*(86/(tasks.length-1)):50,y:ys[i%ys.length]}));
  const curve=pts.length<2?'':pts.reduce((p,q,i,a)=>{if(!i)return 'M '+q.x+' '+q.y;const p0=a[i-2]||a[i-1],p1=a[i-1],p2=q,p3=a[i+1]||p2;return p+' C '+(p1.x+(p2.x-p0.x)/6)+' '+(p1.y+(p2.y-p0.y)/6)+', '+(p2.x-(p3.x-p1.x)/6)+' '+(p2.y-(p3.y-p1.y)/6)+', '+p2.x+' '+p2.y},'');
  const cards=tasks.map((t,i)=>{const p=pts[i],above=i%2===0,sz=sizes[i%sizes.length],top=above?22:304,src=t.src&&t.src[0],state=AI2_ST[t.status],tone='hrcat-c'+((i%4)+1),cardW=158,half=79,edge=162;
    return '<article class="road13-item hr14-road-item '+tone+'"><i class="road13-tether" style="left:'+p.xp+'%;top:'+(above?top+110:p.y+sz/2)+'px;height:'+Math.max(12,above?(p.y-sz/2)-(top+110):top-(p.y+sz/2))+'px"></i><span class="road13-node" style="left:calc('+p.xp+'% - '+(sz/2)+'px);top:'+(p.y-sz/2)+'px;width:'+sz+'px;height:'+sz+'px;cursor:default"><span>'+(i+1)+'</span><i>'+ic('file',10)+'</i></span><div class="road13-card hr14-road-card" style="width:'+cardW+'px;left:clamp(4px,calc('+p.xp+'% - '+half+'px),calc(100% - '+edge+'px));top:'+top+'px"><div class="road13-card-head"><small>'+ic('file',11)+' Task '+String(i+1).padStart(2,'0')+'</small><span class="pill s-'+state[1]+'"><i></i>'+state[0]+'</span></div><h3 title="'+esc(t.title)+'">'+esc(t.title)+'</h3><div class="road13-meta"><span>'+ic('clock',10)+' '+t.minutes+' phút</span><span>'+ic('spark',10)+' '+AI2_CONF[t.conf][0]+'</span></div><div class="hr14-road-actions"><button data-a="ai2AccAsk" data-v="'+t.k+'" title="Chấp nhận">'+ic('check',12)+'</button>'+(src?'<button data-a="ai2Src" data-v="'+t.k+':'+src+'" title="Xem đúng đoạn nguồn">'+ic('eye',12)+'</button>':'')+'<button data-a="ai2EditAsk" data-v="'+t.k+'" title="Sửa">'+ic('edit',12)+'</button><button data-a="ai2Dup" data-v="'+t.k+'" title="Nhân bản">'+ic('copy',12)+'</button><button class="danger" data-a="ai2RejAsk" data-v="'+t.k+'" title="Bỏ khỏi roadmap">'+ic('trash',12)+'</button></div></div></article>'}).join('');
  const road=tasks.length?'<div class="road13-scroll hr14-road-scroll"><div class="road13-canvas" style="width:100%;height:'+Hc+'px"><svg class="road13-svg" viewBox="0 0 '+W+' '+Hc+'" preserveAspectRatio="none" aria-hidden="true"><path class="road13-bed" d="'+curve+'"/><path class="road13-line" d="'+curve+'"/></svg><span class="road13-start hr14-start" style="left:calc('+pts[0].xp+'% - 70px);top:'+(pts[0].y-16)+'px"><b>'+ic('flag',30)+'</b><em>Bắt đầu</em></span><span class="road13-finish hr14-finish" style="left:calc('+pts[pts.length-1].xp+'% + 36px);top:'+(pts[pts.length-1].y-16)+'px"><b>'+ic('award',30)+'</b><em>Hoàn tất</em></span>'+cards+'</div></div>':'';
  return '<div class="pagehead ai14-hero"><div>'+phi('spark','indigo')+'<h1>Roadmap AI đề xuất</h1><p>Giao diện dùng chung với Quản lý task: cùng khoảng cách card, cùng node và đường cong. Bấm biểu tượng mắt trên card để xem đúng đoạn tài liệu nguồn.</p></div><button class="btn sec" data-a="ai2Reset">'+ic('x',13)+' Chọn lại nguồn</button></div><div class="air-summary"><div><span>'+ic('list',17)+'</span><p><small>Task đề xuất</small><b>'+tasks.length+'</b></p></div><div><span class="green">'+ic('check',17)+'</span><p><small>Đã chấp nhận</small><b>'+accepted+'</b></p></div><div><span class="amber">'+ic('clock',17)+'</span><p><small>Chờ xem</small><b>'+pending+'</b></p></div><div class="air-summary-actions"><button class="btn sec" data-a="ai2AccAll" '+(pending?'':'disabled')+'>'+ic('check',14)+' Chấp nhận tất cả</button><button class="btn" data-a="ai2Create" '+(pending===0&&accepted?'':'disabled')+'>'+ic('send',14)+' Thêm vào Quản lý task</button></div></div><section class="ent-journey hr14-journey"><div class="ent-journey-head"><div class="ent-journey-title"><span class="ent-journey-icon">'+ic(DAY_ICON[day[0]]||'flag',18)+'</span><div><h2>'+esc(day[1])+'</h2><small>'+tasks.length+' task AI đề xuất · chưa hiển thị cho nhân viên</small></div></div></div>'+road+'<div class="hr14-road-legend"><b>Màu mốc theo nhóm task</b><span><i class="cat1"></i>Hồ sơ</span><span><i class="cat2"></i>Đào tạo</span><span><i class="cat3"></i>Thiết bị</span><span><i class="cat4"></i>Văn phòng</span></div></section>';
