/* v15+: landing page và login nâng cấp */
.lp{background:var(--bg);color:var(--ink);min-height:100dvh}
.lp-nav{position:fixed;top:var(--proto-h,0px);left:0;right:0;z-index:25;background:transparent;border-bottom:1px solid transparent;transition:background .2s,border-color .2s,top .2s}
.lp-nav.on-light{top:0;background:var(--surface);border-bottom-color:var(--line)}
.lp-nav .brand b,.lp-nav .brand small,.lp-nav .lp-links a{color:#fff;transition:color .2s}
.lp-nav.on-light .brand b{color:var(--ink)}
.lp-nav.on-light .brand small{color:var(--ink-3)}
.lp-nav.on-light .lp-links a{color:var(--ink-2)}
.lp-nav:not(.on-light) .lp-navbtn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.55);color:#fff}
.lp-nav-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:12px 24px}
.lp-links{flex:1;display:flex;gap:22px;justify-content:center}
.lp-links a{color:var(--ink-2);font-size:13.5px;font-weight:500}
.lp-links a:hover{color:var(--accent-strong)}
.lp-hero{background:linear-gradient(160deg,var(--navy) 0%,#123f7a 55%,#0e4d86 100%);color:#fff;padding:72px 24px}
.lp-hero-in{max-width:720px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.lp-hero h1{font-size:34px;font-weight:600;line-height:1.28}
.lp-hero p{color:#cfe6f5;font-size:15px;max-width:560px}
.lp-cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.btn.lg{padding:11px 20px;font-size:14.5px}
.lp-cta .btn.sec{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.35);color:#fff}
.lp-cta .btn.sec:hover{background:rgba(255,255,255,.16)}
.lp-check{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;align-self:flex-start}
.lp-check li{display:flex;gap:8px;align-items:center;color:#e7f3fb;font-size:13.5px}
.lp-check svg{color:#7fd3f5;flex:none}
.lp-services,.lp-roles{max-width:1180px;margin:0 auto;padding:52px 24px}
.lp-services h2,.lp-roles h2{font-size:22px;font-weight:600;text-align:center;margin-bottom:26px}
.lp-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.lp-card{border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:20px 18px;display:flex;flex-direction:column;gap:8px}
.lp-card b{font-size:14.5px;font-weight:600}
.lp-card p{color:var(--ink-2);font-size:12.5px;line-height:1.5;margin:0}
.lp-ic{width:38px;height:38px;border-radius:5px;display:grid;place-items:center;margin-bottom:2px}
.lp-intro{background:var(--surface-2);padding:34px 24px;text-align:center}
.lp-intro p{max-width:640px;margin:0 auto;font-size:15px;color:var(--ink-2)}
.lp-roles-head{text-align:center;margin-bottom:22px}
.lp-roles-head small{color:var(--accent-strong);font-weight:700;letter-spacing:.08em;font-size:11px}
.lp-roles-head h2{margin-top:4px}
.lp-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lp-role{border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:20px 18px;display:flex;flex-direction:column;gap:6px}
.lp-role-ic{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center}
.lp-role small{color:var(--ink-3);font-size:10.5px;font-weight:700;letter-spacing:.06em;margin-top:6px}
.lp-role b{font-size:14.5px;font-weight:600}
.lp-role p{margin:0;color:var(--ink-2);font-size:12.5px;line-height:1.5}
.lp-cta2{background:var(--navy);color:#fff;text-align:center;padding:56px 24px;display:flex;flex-direction:column;align-items:center;gap:10px}
.lp-cta2 h2{font-size:22px;font-weight:600}
.lp-cta2 p{color:#cfe6f5;margin:0}
.lp-foot{max-width:1180px;margin:0 auto;padding:22px 24px 30px;display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12px}
.lp-foot .brand small{max-width:340px}
@media (max-width:1000px){.lp-grid4{grid-template-columns:repeat(2,1fr)}.lp-grid3{grid-template-columns:1fr}.lp-links{display:none}}
@media (max-width:640px){.lp-hero h1{font-size:26px}.lp-foot{flex-direction:column;align-items:flex-start}}

/* login nâng cấp */
.lp-back{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:#9fd4ee;font-size:12.5px;padding:0;margin-bottom:6px}
.lp-back svg{transform:rotate(180deg)}
.story-quote{font-style:italic;color:#9fd4ee;font-size:13px;border-left:2px solid rgba(255,255,255,.3);padding-left:12px;max-width:420px}
.formcard h2{letter-spacing:.04em}
.ifield{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:var(--r);padding:0 10px;background:var(--surface)}
.ifield span{color:var(--ink-3);display:flex}
.ifield input{border:0;flex:1;padding:9px 0;background:transparent;color:var(--ink);font:inherit}
.ifield input:focus{outline:0}
.pwtoggle{border:0;background:none;color:var(--ink-3);padding:4px;cursor:pointer}
.pwtoggle:hover{color:var(--accent-strong)}
.login-first{border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.login-first summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.login-first p{margin:8px 0 0;color:var(--ink-2);font-size:12px}
